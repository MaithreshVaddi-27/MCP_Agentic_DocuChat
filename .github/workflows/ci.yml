name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile rag_backend.py gradio_app.py persistent_memory.py ollama_utils.py llamacpp_utils.py prompt_engineering.py eval/evaluate.py
      - run: python -m unittest discover -s tests -p 'test_*.py'

