name: ci

on:
  # Only main takes the push path. A feature branch with an open PR is
  # already covered by `pull_request` below, and because the two triggers
  # use different refs they do not share a concurrency group — every push to
  # a PR branch was therefore running this whole matrix twice.
  push:
    branches: [main]
  pull_request:
    # A markdown-only change cannot break an import or a test. Skip the
    # four-version matrix for those instead of spending ~12 minutes of
    # runner time on a typo fix. Anything that touches code still runs.
    paths-ignore:
      - '**.md'
      - 'LICENSE'

# Least privilege by default: this workflow only ever reads the repo.
permissions:
  contents: read

# A new push to an open PR makes the previous run irrelevant — don't burn a
# runner re-testing the same commit three times over.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned, not `ubuntu-latest`: GitHub migrates that label to Ubuntu 26 on
    # 2026-10-19, and an OS change landing mid-week is not something you want to
    # discover from a red build. Move it forward on purpose, with a test run.
    runs-on: ubuntu-24.04
    # Cold torch + transformers install is the bulk of this job's runtime.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # requirements.txt is fully pinned, so the cache key changes
          # exactly when the resolved dependency set does.
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q gradio_app.py agentic_docuchat eval tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Smoke test — backend boots with no document
        # The app must come up on a fresh clone, where no PDF exists yet
        # because uploads are git-ignored. Guards the regression where a
        # missing DOCUMENT_PATH took the whole UI down.
        run: |
          python - <<'PY'
          import agentic_docuchat.app as app
          assert app.backend is not None, f"backend failed to start: {app.startup_error}"
          assert app.backend.document_ready is False, "expected no document on a fresh clone"
          assert "upload a PDF" in app._status_text()
          print("boots empty: ok")
          PY

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip build
      # The distribution metadata must stay importable/buildable, not just
      # the source tree.
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import agentic_docuchat; print(agentic_docuchat.__version__)"
