[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name must be a valid PyPI identifier; the project's display
# name everywhere else is MCP_Agentic_DocuChat.
name = "agentic-docuchat"
version = "3.2.0"
description = "MCP_Agentic_DocuChat — chat with your PDFs, locally and with page-cited receipts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maithresh Vaddi" }]
keywords = ["rag", "llm", "ollama", "llama.cpp", "mlx", "langchain", "gradio", "pdf"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
# Runtime dependencies are pinned in requirements.txt — that file is the
# single source of truth for the resolved, verified set.

[project.urls]
Repository = "https://github.com/MaithreshVaddi-27/MCP_Agentic_DocuChat"
Issues = "https://github.com/MaithreshVaddi-27/MCP_Agentic_DocuChat/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_docuchat*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness rules only. Style preferences (SIM/RET) are deliberately not
# enforced — they fight this codebase's plain try/except-pass idiom for no
# bug-catching value.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4"]

[tool.ruff.lint.per-file-ignores]
# B008: the Gradio UI calls components as expressions at import time.
"agentic_docuchat/app.py" = ["B008"]